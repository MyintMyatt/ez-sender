syntax= "proto3";

option java_multiple_files= true;
option java_package = "dev.orion.grpc.notification";
option java_outer_classname = "NotificationProfilesRegister";

message NotificationProfileRegisterRequest {
  string username = 1;
  string email = 2;
  string phone = 3;
  repeated DeviceInfo deviceInfo = 4;
  string tenantId = 5;
}

message DeviceInfo{
  string deviceId = 1;
  string fcmToken = 2;
  string deviceOs = 3;
  string osVersion = 4;
  string appVersion = 5;
}

message NotificationProfileRegisterResponse {
  bool success = 1;
  string message = 2;
}


